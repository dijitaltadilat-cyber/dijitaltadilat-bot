name: Instagram Bot

# Saatler UTC yazılır. Türkiye = UTC+3 (yaz/kış saati yok).
#   Gönderi : Pzt–Cmt 08:37  -> esnaf dükkânı açarken çayını içip telefona bakıyor
#   Reels   : Sal/Per/Cmt 20:43 -> kepenk kapandı, Reels izleme saati
#   Reels   : Pazar 12:17       -> pazar günü, rahat kaydırma saati
on:
  schedule:
    - cron: "37 5 * * 1-6"
    - cron: "43 17 * * 2,4,6"
    - cron: "17 9 * * 0"
  workflow_dispatch:
    inputs:
      kind:
        description: "Ne paylaşılsın?"
        type: choice
        options: [image, reel]
        default: image
      dry_run:
        description: "Sadece üret, Instagram'a atma"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Paylaşım türünü belirle
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 5 * * 1-6" ]; then
            echo "kind=image" >> "$GITHUB_OUTPUT"
          else
            echo "kind=reel" >> "$GITHUB_OUTPUT"
          fi

      - name: Git kimliği
        run: |
          git config user.name "dijitaltadilat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Botu çalıştır
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python check_token.py || true
            python bot.py --kind "${{ steps.kind.outputs.kind }}" --dry-run
          else
            python bot.py --kind "${{ steps.kind.outputs.kind }}"
          fi

      - name: Deneme çıktısını sakla
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: onizleme
          path: media/
